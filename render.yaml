services:
  - type: web
    name: jt-reporting-rates
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    healthCheckPath: /
    envVars:
      - key: KHIS_BASE_URL
        value: https://hiskenya.dha.go.ke/api
      - key: KHIS_USERNAME
        sync: false
      - key: KHIS_PASSWORD
        sync: false
